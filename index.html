<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Valentine 💌</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #fff1f2;
      background-image:
        radial-gradient(rgba(255, 182, 193, 0.25) 10%, transparent 11%),
        radial-gradient(rgba(255, 182, 193, 0.25) 10%, transparent 11%);
      background-size: 120px 120px;
      background-position: 0 0, 60px 60px;

      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #555;
      overflow: hidden;
    }

    .container {
      text-align: center;
      width: 100%;
      height: 100%;
    }

    h1 {
      font-weight: 300;
      letter-spacing: 3px;
      font-size: 3.2rem;
      margin-top: 120px;
    }

    .valentine {
      color: #ff5a5f;
      font-weight: 500;
    }

    .play-area {
      position: relative;
      width: 100%;
      height: 55vh;
      margin-top: 30px;
    }

    button {
      background: transparent;
      border: 2px solid #777;
      padding: 18px 50px;
      font-size: 1.3rem;
      letter-spacing: 2px;
      cursor: pointer;
      position: absolute;
      transition: all 0.4s ease;
    }

    #no {
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    #yes {
      border-color: #ff5a5f;
      color: #ff5a5f;
      opacity: 0;
      pointer-events: none;
    }

    /* FINAL PAGE */
    .final-message {
      display: none;
      margin-top: 60px;
    }

    .final-message h2 {
      font-size: 2.6rem;
      color: #ff5a5f;
      margin-bottom: 25px;
    }

    .final-content img {
      width: 240px;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    /* HEART CONFETTI */
    .heart {
      position: fixed;
      color: #ff5a5f;
      font-size: 20px;
      animation: floatUp 2.5s ease forwards;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-250px) scale(1.8);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>
      WILL YOU BE MY <span class="valentine">VALENTINE?</span>
    </h1>

    <div class="play-area">
      <button id="no">NO</button>
      <button id="yes">YES</button>
    </div>

    <div class="final-message" id="final">
      <h2>You're stuck with me.<br>I love you 💓</h2>
      <div class="final-content">
        <img src="him.jpg" alt="My favorite person">
      </div>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const finalMsg = document.getElementById("final");
    const area = document.querySelector(".play-area");

    const noTexts = [
      "NO",
      "Are you sure?",
      "Really?",
      "Think again",
      "Bad choice",
      "Still no?",
      "Just say yes"
    ];

    let noAttempts = 0;
    let yesMoves = 0;

    function randomPosition(btn) {
      const maxX = area.clientWidth - btn.offsetWidth;
      const maxY = area.clientHeight - btn.offsetHeight;
      btn.style.left = Math.random() * maxX + "px";
      btn.style.top = Math.random() * maxY + "px";
      btn.style.transform = "none";
    }

    function moveNo() {
      noAttempts++;
      noBtn.innerText = noTexts[Math.min(noAttempts, noTexts.length - 1)];
      randomPosition(noBtn);

      if (noAttempts >= 3) {
        yesBtn.style.opacity = "0.25";
        yesBtn.style.pointerEvents = "auto";
        randomPosition(yesBtn);
      }
      if (noAttempts >= 5) yesBtn.style.opacity = "0.5";
      if (noAttempts >= 7) yesBtn.style.opacity = "0.85";
    }

    noBtn.addEventListener("mouseover", moveNo);
    noBtn.addEventListener("click", moveNo);

    yesBtn.addEventListener("mouseover", () => {
      yesMoves++;
      if (yesMoves <= 3) {
        randomPosition(yesBtn);
      } else if (yesMoves <= 5) {
        yesBtn.style.transition = "all 0.8s ease";
        randomPosition(yesBtn);
      } else {
        yesBtn.style.transition = "none";
      }
    });

    function heartConfetti() {
      for (let i = 0; i < 30; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerText = "💖";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.top = "100vh";
        heart.style.fontSize = Math.random() * 15 + 15 + "px";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 2500);
      }
    }

    yesBtn.addEventListener("click", () => {
      document.querySelector("h1").style.display = "none";
      document.querySelector(".play-area").style.display = "none";
      finalMsg.style.display = "block";
      heartConfetti();
    });
  </script>
</body>
</html>
