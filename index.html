<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Valentine?</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fafafa;
      font-family: "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      position: relative;
    }

    h1 {
      font-weight: 300;
      letter-spacing: 2px;
      color: #444;
    }

    h1 span {
      color: #e76f6f;
    }

    .buttons {
      margin-top: 40px;
      display: flex;
      gap: 120px;
      justify-content: center;
      position: relative;
    }

    button {
      padding: 14px 40px;
      font-size: 18px;
      border: 2px solid #444;
      background: white;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background: #f3f3f3;
    }

    #yesBtn {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

<canvas id="confetti"></canvas>

<div class="container">
  <h1>WILL YOU BE MY <span>VALENTINE?</span></h1>

  <div class="buttons">
    <button id="noBtn">NO</button>
    <button id="yesBtn">YES</button>
  </div>
</div>

<script>
  const yesBtn = document.getElementById("yesBtn");
  const noBtn = document.getElementById("noBtn");

  let moveCount = 0;
  let speedFactor = 1;

  function moveYes() {
    moveCount++;

    // After 3–4 tries, slow down movement
    if (moveCount > 4) {
      speedFactor = 0.4;
    }

    const maxX = window.innerWidth - yesBtn.offsetWidth;
    const maxY = window.innerHeight - yesBtn.offsetHeight;

    const x = Math.random() * maxX * speedFactor;
    const y = Math.random() * maxY * speedFactor;

    yesBtn.style.left = `${x}px`;
    yesBtn.style.top = `${y}px`;
  }

  yesBtn.addEventListener("mouseenter", moveYes);
  noBtn.addEventListener("mouseenter", moveYes);

  yesBtn.addEventListener("click", () => {
    startConfetti();
    setTimeout(() => {
      alert("YAY 💖 Valentine confirmed!");
    }, 300);
  });

  // ❤️ HEART CONFETTI (FULL SCREEN)
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  let hearts = [];

  function createHeart() {
    return {
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 20 + 10,
      speedY: Math.random() * 2 + 1,
      speedX: Math.random() * 2 - 1,
      alpha: 1
    };
  }

  function drawHeart(h) {
    ctx.save();
    ctx.globalAlpha = h.alpha;
    ctx.fillStyle = "#e63946";
    ctx.beginPath();
    ctx.moveTo(h.x, h.y);
    ctx.bezierCurveTo(h.x - h.size / 2, h.y - h.size / 2,
                      h.x - h.size, h.y + h.size / 3,
                      h.x, h.y + h.size);
    ctx.bezierCurveTo(h.x + h.size, h.y + h.size / 3,
                      h.x + h.size / 2, h.y - h.size / 2,
                      h.x, h.y);
    ctx.fill();
    ctx.restore();
  }

  function animateConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    hearts.forEach((h, i) => {
      h.y += h.speedY;
      h.x += h.speedX;
      h.alpha -= 0.01;

      if (h.alpha <= 0) hearts.splice(i, 1);
      else drawHeart(h);
    });

    if (hearts.length > 0) requestAnimationFrame(animateConfetti);
  }

  function startConfetti() {
    hearts = [];
    for (let i = 0; i < 120; i++) {
      hearts.push(createHeart());
    }
    animateConfetti();
  }

  window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });
</script>

</body>
</html>
