<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Valentine 💌</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #f6f6f6;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #555;
    }

    .container {
      text-align: center;
      position: relative;
      width: 100%;
      height: 100%;
    }

    h1 {
      font-weight: 300;
      letter-spacing: 2px;
      margin-bottom: 60px;
    }

    .valentine {
      color: #ff6b6b;
      font-weight: 400;
    }

    .buttons {
      display: flex;
      justify-content: space-around;
      width: 60%;
      margin: auto;
      margin-top: 40px;
      position: relative;
    }

    button {
      background: transparent;
      border: 2px solid #777;
      padding: 18px 40px;
      font-size: 1.2rem;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background: #eee;
    }

    #yes {
      display: none; /* hidden initially */
      border-color: #ff6b6b;
      color: #ff6b6b;
    }

    #no {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .message {
      display: none;
      font-size: 2.5rem;
      color: #ff6b6b;
      margin-top: 40px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>
      WILL YOU BE MY <span class="valentine">VALENTINE?</span>
    </h1>

    <div class="buttons">
      <button id="no">NO</button>
      <button id="yes">YES</button>
    </div>

    <div class="message" id="message">
      Correct choice ❤️<br />
      I love you 😌
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const message = document.getElementById("message");
    const buttons = document.querySelector(".buttons");

    let escapeCount = 0;

    function moveNo() {
      escapeCount++;

      const x = Math.random() * (window.innerWidth - 200);
      const y = Math.random() * (window.innerHeight - 200);

      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;

      // After a few tries, reveal YES
      if (escapeCount === 3) {
        yesBtn.style.display = "inline-block";
      }
    }

    noBtn.addEventListener("mouseover", moveNo);
    noBtn.addEventListener("click", moveNo);

    yesBtn.addEventListener("click", () => {
      buttons.style.display = "none";
      message.style.display = "block";
    });
  </script>
</body>
</html>
